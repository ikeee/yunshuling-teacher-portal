map $http_upgrade $ysl_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ysl_teacher_admin {
    server 127.0.0.1:8781;
    keepalive 16;
}

server
{
    listen 80;
    listen [::]:80;
    server_name teacher.yunshuling.com;
    root /www/wwwroot/teacher.yunshuling.com;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/teacher.yunshuling.com; }
    location / { return 301 https://$host$request_uri; }
    access_log /www/wwwlogs/teacher.yunshuling.com.log;
}

server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name teacher.yunshuling.com;

    ssl_certificate     /www/server/panel/vhost/cert/teacher.yunshuling.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/teacher.yunshuling.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AESGCM:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- 访问控制：Cookie 登录；门户首页公开，只有卡片进入的子应用要口令 ----
    error_page 401 = @need_login;

    location = /_auth {
        internal;
        auth_request off;
        proxy_pass http://ysl_teacher_admin/_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /login {
        auth_request off;
        proxy_pass http://ysl_teacher_admin/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /register {
        auth_request off;
        proxy_pass http://ysl_teacher_admin/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        auth_request off;
        proxy_pass http://ysl_teacher_admin/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @need_login {
        return 302 /login?next=$request_uri;
    }

    location @need_membership {
        return 302 /login?reason=membership&next=$request_uri;
    }

    # Nuxt-Admin 页面、认证 API 与构建资源。注意 ^~ 要压在下面的静态资源正则之前。
    location ^~ /_nuxt/ {
        proxy_pass http://ysl_teacher_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
    }

    location ^~ /dashboard {
        proxy_pass http://ysl_teacher_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://ysl_teacher_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ysl_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /profile {
        proxy_pass http://ysl_teacher_admin/profile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /notifications {
        proxy_pass http://ysl_teacher_admin/notifications;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /messages {
        proxy_pass http://ysl_teacher_admin/messages;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 不进搜索引擎 ----
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # 最小 CSP：只管"能不能被嵌框/改 base/加载插件"，不动 inline 样式（媒体工具页有内联 style）
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS：堵住「首次 http 请求」的降级窗口（服务器本来就 301，但第一个请求没保护）
    add_header Strict-Transport-Security "max-age=15552000" always;

    # 门户站静态资源
    location ~* \.(?:css|js|svg|jpg|jpeg|png|woff2?)$ {
        # 静态资源路径同样要过 Basic Auth → 不限流就等于给了爆破后门（2026-10-17 实测）
        limit_req zone=ysl_auth burst=80 nodelay;
        limit_req_status 429;
        root /www/wwwroot/teacher.yunshuling.com;
        expires -1;  # 门户静态资源不缓存（老师看到旧卡片就是被这个咬的，2026-10-17）
        access_log off;
    }

    # 子应用：B站下载器（nginx 剥掉 /bili 前缀再转给本机 8765）
    location = /bili { return 301 /bili/; }
    # ^~ 很关键：否则上面那条 *.js/*.css 正则 location 会先抢走 /bili/static/*，导致 404
    location ^~ /bili/ {
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 403 = @need_membership;
        limit_req zone=ysl_auth burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # 覆盖为真实对端：别把客户端伪造的 XFF 传进应用
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User       $auth_user;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # 子应用：小红书下载器（同样 ^~ 保护，端口 8766）
    location = /xhs { return 301 /xhs/; }
    location ^~ /xhs/ {
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 403 = @need_membership;
        limit_req zone=ysl_auth burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8766/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # 覆盖为真实对端：别把客户端伪造的 XFF 传进应用
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User       $auth_user;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }

    # 子应用：音乐下载器（同 ^~ 保护，端口 8767）
    location = /music { return 301 /music/; }
    location ^~ /music/ {
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 403 = @need_membership;
        limit_req zone=ysl_auth burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8767/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # 覆盖为真实对端：别把客户端伪造的 XFF 传进应用
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User       $auth_user;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }

    # 子应用：员工人脸采集（前端公开，管理端仍需登录；端口 8768）
    location = /face { return 301 /face/; }

    location ^~ /face/admin {
        auth_request off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        proxy_pass http://127.0.0.1:8768/admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 14m;
    }

    # 管理后台的登录与接口：不再叠加门户口令，只认后台自己的管理口令
    location = /face/api/login {
        auth_request off;
        proxy_pass http://127.0.0.1:8768/api/login;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /face/api/logout {
        auth_request off;
        proxy_pass http://127.0.0.1:8768/api/logout;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /face/api/admin/ {
        auth_request off;
        proxy_pass http://127.0.0.1:8768/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 采集页要允许摄像头（站点级 Permissions-Policy 把 camera 关掉了，这里覆盖）
    location ^~ /face/ {
        auth_request off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass http://127.0.0.1:8768/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 14m;
    }

    # 纯前端媒体工具箱：从卡片进入才要口令（静态资源一并挡住）
    location ^~ /media/ {
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 403 = @need_membership;
        limit_req zone=ysl_auth burst=80 nodelay;
        limit_req_status 429;
        root /www/wwwroot/teacher.yunshuling.com;
        try_files $uri $uri/ =404;
        expires -1;
    }
    # 门户站页面（含 /bili 之外的路径）
    location / {
        limit_req zone=ysl_auth burst=80 nodelay;
        limit_req_status 429;
        root /www/wwwroot/teacher.yunshuling.com;
        try_files $uri $uri/ =404;
    }

    client_max_body_size 4m;
    access_log /www/wwwlogs/teacher.yunshuling.com.log;
}
