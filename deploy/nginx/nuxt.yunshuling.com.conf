map $http_upgrade $ysl_nuxt_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ysl_nuxt_admin {
    server 127.0.0.1:8781;
    keepalive 16;
}

server
{
    listen 80;
    listen [::]:80;
    server_name nuxt.yunshuling.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/nuxt.yunshuling.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/nuxt.yunshuling.com.log;
}

server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nuxt.yunshuling.com;

    ssl_certificate     /www/server/panel/vhost/cert/nuxt.yunshuling.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/nuxt.yunshuling.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AESGCM:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    error_page 401 = @need_login;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location = /_auth {
        internal;
        auth_request off;
        proxy_pass http://ysl_nuxt_admin/_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @need_login {
        return 302 /login?next=$request_uri;
    }

    location @need_membership {
        return 302 /login?reason=membership&next=$request_uri;
    }

    location ^~ /_nuxt/ {
        proxy_pass http://ysl_nuxt_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
    }

    location ^~ /api/ {
        proxy_pass http://ysl_nuxt_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ysl_nuxt_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /bili { return 301 /bili/; }
    location ^~ /bili/ {
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 403 = @need_membership;
        limit_req zone=ysl_auth burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User       $auth_user;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location = /xhs { return 301 /xhs/; }
    location ^~ /xhs/ {
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 403 = @need_membership;
        limit_req zone=ysl_auth burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8766/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User       $auth_user;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }

    location = /music { return 301 /music/; }
    location ^~ /music/ {
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 403 = @need_membership;
        limit_req zone=ysl_auth burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8767/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User       $auth_user;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }

    location = /face { return 301 /face/; }
    location ^~ /face/ {
        auth_request off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass http://127.0.0.1:8768/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 14m;
    }

    location ^~ /media/ {
        auth_request /_auth;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 403 = @need_membership;
        limit_req zone=ysl_auth burst=80 nodelay;
        limit_req_status 429;
        root /www/wwwroot/teacher.yunshuling.com;
        try_files $uri $uri/ =404;
        expires -1;
    }

    location / {
        limit_req zone=ysl_auth burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://ysl_nuxt_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ysl_nuxt_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    client_max_body_size 4m;
    access_log /www/wwwlogs/nuxt.yunshuling.com.log;
}
